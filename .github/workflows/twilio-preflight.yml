name: Twilio isolated preflight
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/twilio-preflight.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/**'
      - 'src/app/api/twilio/**'
      - 'src/app/api/internal/communications/**'
      - 'tests/unit/twilio*'
      - 'scripts/twilio-*.mjs'
permissions:
  contents: read
concurrency:
  group: twilio-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/twilio-comms'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean locked dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Collect source for review
        run: |
          mkdir -p /tmp/twilio-preflight
          git archive --format=tar.gz -o /tmp/twilio-preflight/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/twilio-preflight/commit.txt
      - name: Provisioning safety tests with fake carrier
        id: provisioning
        continue-on-error: true
        run: node --test scripts/twilio-configure.test.mjs | tee /tmp/twilio-preflight/provisioning.log
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint | tee /tmp/twilio-preflight/lint.log
      - name: Database type contract
        id: dbtypes
        continue-on-error: true
        run: npm run types:database:check | tee /tmp/twilio-preflight/database-types.log
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npm run typecheck | tee /tmp/twilio-preflight/typecheck.log
      - name: Unit tests (no live provider credentials)
        id: tests
        continue-on-error: true
        run: npm run test | tee /tmp/twilio-preflight/tests.log
      - name: Production build (no live provider credentials)
        id: build
        continue-on-error: true
        run: npm run build | tee /tmp/twilio-preflight/build.log
      - name: Upload test artifacts (no credentials or production data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twilio-preflight
          path: /tmp/twilio-preflight/
          retention-days: 3
      - name: Report checks accurately
        if: always()
        env:
          PROVISIONING: ${{ steps.provisioning.outcome }}
          LINT: ${{ steps.lint.outcome }}
          DBTYPES: ${{ steps.dbtypes.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          printf 'provisioning=%s\nlint=%s\ndatabase-types=%s\ntypecheck=%s\ntests=%s\nbuild=%s\n' "$PROVISIONING" "$LINT" "$DBTYPES" "$TYPECHECK" "$TESTS" "$BUILD"
          for outcome in "$PROVISIONING" "$LINT" "$DBTYPES" "$TYPECHECK" "$TESTS" "$BUILD"; do
            [ "$outcome" = success ] || exit 1
          done
    defaults:
      run:
        shell: bash
