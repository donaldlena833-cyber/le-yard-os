name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types:database:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build

  reservation-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:reservations:concurrency
        env:
          RESERVATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:reservation-push:concurrency
        env:
          RESERVATION_PUSH_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:schedule-atomic:concurrency
        env:
          SCHEDULE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: npm run test:service-shifts:concurrency
        env:
          SERVICE_SHIFT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

  demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=desktop-chromium
